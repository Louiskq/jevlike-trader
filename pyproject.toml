[project]
name = "jevhl"
version = "0.1.0"
description = "Hyperliquid testnet decision trader"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "hyperliquid-python-sdk>=0.24.0",
    "uvicorn>=0.54.0",
    "websockets>=17.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pytest>=8",
    "ruff>=0.6",
]
study = [
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevhl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "study"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_dashboard_js.py" = ["E501"]  # embedded JavaScript
